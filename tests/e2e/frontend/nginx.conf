server {
    listen 80;
    root /usr/share/nginx/html;
    # The board's nginx sends this policy (shareframe-hardware security-headers.conf); the specs run under it.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    gzip_static on;
    gzip_vary on;

    location /api/ {
        proxy_pass http://board:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location = /api/frame/default-images {
        client_max_body_size 21m;
        proxy_pass http://board:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
