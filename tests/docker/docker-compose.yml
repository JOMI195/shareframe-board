name: shareframe-board-cpp-test

services:
  cpp:
    build: .
    image: shareframe-board-cpp-test
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      SHAREFRAME_BUILD_ROOT: /src/build-docker
      # The contract tests parse shareframe-hardware's goldens.
      SHAREFRAME_HARDWARE_DIR: /hardware
    volumes:
      - ../..:/src
      - ${SHAREFRAME_HARDWARE_DIR:-../../../shareframe-hardware}:/hardware:ro
    entrypoint: ["/src/test.sh"]
